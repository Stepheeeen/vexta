name: Retry Stuck Commissions Cron

on:
  schedule:
    # Run every 15 minutes. The endpoint only reprocesses investments whose
    # commission propagation has been stuck in 'pending' for > 30 minutes, so a
    # 15-min cadence guarantees a stuck payout is retried within ~45 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger commission retry reconciler
        run: |
          curl -i -X POST \
            "https://vexta.network/api/admin/retry-commissions?secret=${{ secrets.CRON_SECRET }}&source=github_action&t=$(date +%s)"
